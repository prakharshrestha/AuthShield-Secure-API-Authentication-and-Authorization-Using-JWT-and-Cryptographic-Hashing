[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authshield"
version = "1.0.0"
description = "Secure API Authentication & Authorization Using JWT & Cryptographic Hashing"
authors = [
  { name = "Prakhar Shrestha", email = "prakhar.shresth@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "argon2-cffi>=23.1.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
